[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obelisk"
version = "1.0.0"
description = "OBELISK - Search & Intelligence Engine for the Royal Mint"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
obelisk = "obelisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
